[package]
name = "samo-windows"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
samo-primitives.workspace = true
samo-blueprint.workspace = true
samo-domain.workspace = true
serde.workspace = true
sysinfo.workspace = true
chrono.workspace = true

# ADR-006: Windows calls only through safe crates (R29). The Recycle Bin with Undo (`trash`), a file's volume serial
# and file index (`winapi-util`), its size on disk (`filesize`), and each volume's Recycle Bin settings
# (`windows-registry`, Microsoft's, already in the lockfile).
[target.'cfg(windows)'.dependencies]
trash = { version = "5.2.9", default-features = false, features = ["coinit_apartmentthreaded"] }
winapi-util = "0.1.11"
filesize = "0.2"
windows-registry = "0.5.3"
# Which cores are for performance and which for efficiency (Windows' EfficiencyClass), for the Cores card. KJ chose it
# on 2026-11-10: a safe crate over GetLogicalProcessorInformationEx, whose own dependencies (windows, raw-cpuid,
# bitflags) were already in the lockfile. Pinned, as it is young.
gdt-cpus = { version = "=0.2606.1", default-features = false }

[dev-dependencies]
tempfile.workspace = true
