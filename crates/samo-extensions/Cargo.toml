[package]
name = "samo-extensions"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
samo-primitives.workspace = true
samo-domain.workspace = true
samo-ext-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
sysinfo.workspace = true
chrono.workspace = true
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }

# The window check (ADR-004, R15) reads the Mac's window server; Windows' comes with #9 (ADR-006).
[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-foundation = { workspace = true, features = ["NSArray", "NSDictionary", "NSString", "NSValue", "NSObject", "NSEnumerator"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "objc2", "CFArray"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGWindow"] }

# Installing on Windows (ADR-006): `current` is a junction, which needs no Developer Mode or admin (`junction`,
# safe API, windows-sys already in the lockfile), and a hard-linked file is told by its link count (`winapi-util`,
# as in samo-windows).
[target.'cfg(windows)'.dependencies]
junction = { version = "2.1.0", default-features = false }
winapi-util = "0.1.11"

[dev-dependencies]
samo-testkit.workspace = true
tempfile.workspace = true
