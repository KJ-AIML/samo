[package]
name = "samo-shots"
version = "0.4.0"
edition.workspace = true
license.workspace = true
publish = false

# Shots for Windows (#12, ADR-004, ADR-006): the Mac's Shots is Swift (extensions/shots); this is its Rust
# counterpart, the same captures, editor, tools and page. Its core is pure and tested on every OS; capturing, the
# overlay, the editor's window and the rest of Windows are Windows-only.

[lints]
workspace = true

[[bin]]
name = "samo-shots"
path = "src/main.rs"

[dependencies]
samo-ext-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
# Shots' images: PNG with its density (the `png` crate), JPEG and scaling (`image`); both already in the lockfile
# through gpui (MIT/Apache-2.0).
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
png = "0.18.1"

[dev-dependencies]
tempfile.workspace = true
