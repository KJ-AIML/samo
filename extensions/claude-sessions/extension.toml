id = "claude-sessions"
name = "Claude Sessions"
version = "0.2.4"
protocol = 1
min_samo = "0.2.0"
helper = "bin/samo-claude"
summary = "Your Claude Code sessions at a glance: who's working, who needs you, today's tokens, plan limits"

[[changes]]
what = "Adds hooks to Claude Code's settings when you press Connect, after backing the file up"
where = "~/.claude/settings.json (backup: settings.json.samo-bak)"
undo = "Disconnect, Off or Remove takes exactly them out"

[[changes]]
what = "Sets Claude Code's status line when you turn on Plan limits, never replacing one you have"
where = "~/.claude/settings.json"
undo = "Turning Plan limits off, Off or Remove takes it out"

[[changes]]
what = "Reads today's Claude Code transcripts to count tokens; never changes them"
where = "~/.claude/projects"
undo = "Nothing to undo"

[[changes]]
what = "Only while you turn on Ask Anthropic for limits: reads Claude Code's sign-in, never changing or renewing it, and asks Anthropic for your plan limits every 5 minutes"
where = "api.anthropic.com/api/oauth/usage, with the sign-in in the Keychain (Claude Code-credentials) or ~/.claude/.credentials.json"
undo = "Turn it off; nothing is kept"

[[settings]]
key = "connect"
label = "Connect to Claude Code"

[[settings]]
key = "plan_limits"
label = "Plan limits"

[[settings]]
key = "ask_anthropic"
label = "Ask Anthropic for limits"

[[settings]]
key = "popup_needs_you"
label = "Pop up when a session needs you"
default = true

[[settings]]
key = "popup_finished"
label = "Pop up when a turn finishes"
default = true
