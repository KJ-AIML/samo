[package]
name = "samo-claude"
version = "0.2.3"
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "samo-claude"
path = "src/main.rs"

# Test-only stand-in for Claude Code: it stays alive until killed and runs the hook as its child. Never packaged.
[[bin]]
name = "fake-claude"
path = "tests/support/fake_claude.rs"
test = false

[dependencies]
samo-primitives.workspace = true
samo-ext-protocol.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
sysinfo.workspace = true
chrono.workspace = true
# Only in src/online.rs, while Ask Anthropic for limits is on (ADR-002 C3 as amended; the network gate checks).
ureq = { version = "3", default-features = false, features = ["rustls"] }

[dev-dependencies]
samo-extensions.workspace = true
tempfile.workspace = true
samo-testkit.workspace = true
samo-domain.workspace = true
