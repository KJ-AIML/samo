[package]
name = "samo-gpui"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[build-dependencies]
# Samo's icon in Samo.exe (build.rs, Windows only); already in the lockfile through GPUI.
embed-resource = "3.0.12"

[dependencies]
samo-primitives.workspace = true
samo-blueprint.workspace = true
samo-domain.workspace = true
samo-extensions.workspace = true
samo-ext-protocol.workspace = true
gpui.workspace = true
chrono.workspace = true
futures.workspace = true
tray-icon.workspace = true

# ADR-006: one platform crate per OS, and AppKit only on the Mac. On Windows the screen scale comes from the
# DPI the user chose (windows-registry, safe).
[target.'cfg(target_os = "macos")'.dependencies]
samo-macos.workspace = true
objc2.workspace = true
image.workspace = true
# App icons and which processes are Dock applications (src/app_icons.rs): safe AppKit calls only.
objc2-app-kit = { workspace = true, features = [
    "NSApplication",
    "NSResponder",
    "NSWorkspace",
    "NSRunningApplication",
    "NSImage",
    "NSImageRep",
    "NSBitmapImageRep",
    "libc",
] }
objc2-foundation = { workspace = true, features = ["NSArray", "NSData", "NSString"] }

[target.'cfg(windows)'.dependencies]
samo-windows.workspace = true
windows-registry = "0.5.3"
# Processes' app icons (app_icons.rs, exe_icon.rs): an .exe's own icon decoded from its resources (`ico`, image's
# own decoder, no new crate), and which processes have a window on the taskbar (winsafe, as samo-extensions has).
image = { workspace = true, features = ["ico"] }
winsafe = { version = "0.0.29", features = ["user", "dwm"] }

[dev-dependencies]
tempfile.workspace = true
samo-testkit.workspace = true
