[package]
name = "samo-gpui"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
samo-primitives.workspace = true
samo-blueprint.workspace = true
samo-domain.workspace = true
samo-extensions.workspace = true
samo-ext-protocol.workspace = true
gpui.workspace = true
chrono.workspace = true
futures.workspace = true
tray-icon.workspace = true

# ADR-006: one platform crate per OS, and AppKit only on the Mac. On Windows the screen scale comes from the
# DPI the user chose (windows-registry, safe).
[target.'cfg(target_os = "macos")'.dependencies]
samo-macos.workspace = true
objc2.workspace = true
objc2-app-kit = { workspace = true, features = ["NSApplication", "NSResponder"] }
objc2-foundation.workspace = true

[target.'cfg(windows)'.dependencies]
samo-windows.workspace = true
windows-registry = "0.5.3"

[dev-dependencies]
tempfile.workspace = true
samo-testkit.workspace = true
