[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
chrono.workspace = true
ring.workspace = true
samo-domain.workspace = true
samo-ext-protocol.workspace = true
# Packages are made and read in-process, the same on the Mac and Windows (ADR-006).
tar = { version = "0.4.46", default-features = false }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# Samo.ico from Samo.icns (`windows-icon`); `image` is already in the lockfile through GPUI.
icns = "0.5.0"
ico = "0.6.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[dev-dependencies]
tempfile.workspace = true
